name: Publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    uses: SlimefunNewHorizons/.github/.github/workflows/publish-blob.yml@main
    with:
      project: MultiverseProgramming
      java-version: '25'
      blob: ${{ github.event_name != 'workflow_dispatch' }}
    secrets: inherit
